name: Run Tests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/run_tests.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  CoreRequirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime requirements only
        run: pip install -r requirements-core.txt
      - name: Import core and run a 1v1 pairing
        run: |
          PYTHONPATH=. python - <<'PY'
          from src.core import Tournament, TournamentAction, TournamentConfiguration
          TournamentAction.LOGF = False
          t = Tournament(TournamentConfiguration(ruleset="Mtg1v1Ruleset", auto_export=False, n_rounds=2))
          t.add_player(["A", "B", "C", "D"])
          t.new_round()
          t.create_pairings()
          assert len(t.tour_round.pods) == 2
          PY

  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          mkdir -p test-reports
          pytest -m "not slow and not gui" --junitxml=test-reports/results.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: Test Results
          path: test-reports/*.xml
          reporter: java-junit
          only-summary: 'false'
      #- name: Upload Test Reports
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: test-reports
      #    path: test-reports/
      #  if: always()
